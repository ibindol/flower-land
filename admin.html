<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>꽃나라 사진 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1ea;--paper:#fffdf9;--ink:#33291f;--muted:#7a6c60;--line:#e6d9cb;--line2:#d8c7b5;--rose:#b5485f;--rose-d:#93354a;--rose-soft:#f6e1e2;--ok:#5b7a4c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 0;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:19px}
header a{color:var(--muted);font-size:14px}
h2{font-size:21px;margin:26px 0 6px}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line2);background:var(--paper);border-radius:999px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.small{padding:5px 12px;font-size:14px}
.btn.danger{color:var(--rose-d)}
.btn:disabled{opacity:.5;cursor:default}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.login{max-width:380px;margin:60px auto}
.login input{width:100%;font:inherit;font-size:17px;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:2px dashed var(--rose);border-radius:16px;background:#fff;min-height:120px;cursor:pointer;color:var(--rose);font-size:17px}
.add big{font-size:44px;line-height:1}
.add:focus-within{outline:3px solid var(--rose-soft)}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item.new{border:2px solid var(--rose)}
.item .pic{position:relative;background:#f2ede7;height:220px}
.item .pic img{width:100%;height:100%;object-fit:contain;display:block;background:#f2ede7}
.item .no{position:absolute;left:8px;top:8px;background:rgba(255,253,249,.95);border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
.item .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.item input[type=text]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line2);border-radius:9px;padding:7px 10px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.lbl{font-size:13px;color:var(--muted);margin-right:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.state{font-size:13px;color:var(--ok);min-height:1em}
.state.err{color:var(--rose-d)}
.warn{background:#fff6e0;border:1px solid #ecd9a8;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14.5px;z-index:50;max-width:calc(100% - 32px)}
.hide{display:none!important}
.count{color:var(--muted);font-size:14px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap"><b>꽃나라 사진 관리</b><span><a href="/#shop" target="_blank" rel="noopener">사이트 보기</a> · <a href="#" id="logout">나가기</a></span></div></header>

<main class="wrap">
  <section class="login box" id="loginBox">
    <h2 style="margin-top:0">사장님 확인</h2>
    <p class="hint">관리용 비밀번호를 넣어 주세요.</p>
    <form id="loginForm"><input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required><button class="btn primary" style="width:100%">들어가기</button></form>
    <p class="state err" id="loginMsg"></p>
  </section>

  <div id="app" class="hide">
    <h2>새 사진 올리기</h2>
    <p class="warn">리본이나 카드에 <b>받는 분 이름·전화번호</b>가 보이면, 휴대폰에서 그 부분을 잘라 내고 올려 주세요.</p>
    <label class="add"><big>＋</big>사진 고르기 (여러 장 가능)<input type="file" id="file" accept="image/*" multiple></label>
    <div class="list" id="newList"></div>
    <p id="upAllRow" class="hide" style="margin:12px 0 0"><button class="btn primary" id="upAll">모두 올리기</button></p>

    <h2>올린 사진 <span class="count" id="count"></span></h2>
    <p class="hint">위에 있는 사진부터 사이트에 먼저 보여요. 이름·색감을 고친 뒤에는 <b>저장</b>을 눌러 주세요. 번호는 바뀌지 않아요.</p>
    <div class="list" id="list"></div>
  </div>
</main>
<div class="toast hide" id="toast" role="status"></div>

<script>
(function(){
var TONES=[['red','빨강'],['pink','분홍'],['yellow','노랑·주황'],['purple','보라'],['pastel','연한 파스텔'],['mix','알록달록']];
var KINDS=[['basket','꽃바구니'],['bouquet','꽃다발']];
var $=function(id){return document.getElementById(id);};
var KEY='';try{KEY=sessionStorage.getItem('kkotnara-admin')||'';}catch(e){}
var ITEMS=[],NEW=[],nid=0;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hide');},2800);}
function no(n){return (n<10?'0':'')+n;}
function api(body){return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){if(r.status===401)logout(true);throw new Error(d.error||'문제가 생겼어요');}return d;});});}
function logout(bad){KEY='';try{sessionStorage.removeItem('kkotnara-admin');}catch(e){}$('app').classList.add('hide');$('loginBox').classList.remove('hide');if(bad)$('loginMsg').textContent='비밀번호를 다시 넣어 주세요.';}
function enter(){$('loginBox').classList.add('hide');$('app').classList.remove('hide');load();}
$('loginForm').addEventListener('submit',function(e){e.preventDefault();KEY=$('pw').value.trim();$('loginMsg').textContent='확인하는 중…';
  api({action:'check'}).then(function(){try{sessionStorage.setItem('kkotnara-admin',KEY);}catch(e){}$('loginMsg').textContent='';$('pw').value='';enter();})
  .catch(function(err){$('loginMsg').textContent=err.message;});});
$('logout').addEventListener('click',function(e){e.preventDefault();logout();});

function load(){fetch('/api/shop?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ITEMS=d.items||[];renderList();}).catch(function(){toast('목록을 불러오지 못했어요.');});}

function metaFields(o,pfx){
  var tones=TONES.map(function(t){return '<button type="button" class="chip" data-tone="'+t[0]+'" aria-pressed="'+(o.tones.indexOf(t[0])>=0)+'">'+t[1]+'</button>';}).join('');
  var kinds=KINDS.map(function(k){return '<button type="button" class="chip" data-kind="'+k[0]+'" aria-pressed="'+(o.kind===k[0])+'">'+k[1]+'</button>';}).join('');
  return '<input type="text" maxlength="40" data-f="name" value="'+esc(o.name)+'" placeholder="이름 (예: 분홍 장미 바구니)" aria-label="이름">'+
    '<div class="row"><span class="lbl">모양</span>'+kinds+'</div><div class="row"><span class="lbl">색감</span>'+tones+'</div>';}
function readMeta(card){return {name:card.querySelector('[data-f=name]').value.trim(),
  kind:(card.querySelector('[data-kind][aria-pressed=true]')||{dataset:{kind:'basket'}}).dataset.kind,
  tones:[].map.call(card.querySelectorAll('[data-tone][aria-pressed=true]'),function(b){return b.dataset.tone;})};}
function chipClicks(root){root.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;
  if(b.dataset.kind){b.parentNode.querySelectorAll('[data-kind]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});}
  else b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));
  var card=b.closest('.item');if(card&&card.dataset.no){var st=card.querySelector('.state');st.className='state';st.textContent='바뀐 내용이 있어요. 저장을 눌러 주세요.';}});}
chipClicks($('list'));chipClicks($('newList'));

function renderList(){$('count').textContent=ITEMS.length+'장';
  $('list').innerHTML=ITEMS.map(function(x,i){return '<div class="item" data-no="'+x.no+'"><div class="pic"><img src="'+esc(x.s)+'" alt="" loading="lazy"><span class="no">'+no(x.no)+'번</span></div><div class="body">'+metaFields(x)+
    '<div class="acts"><button type="button" class="btn small primary" data-act="save">저장</button><button type="button" class="btn small" data-act="top"'+(i===0?' disabled':'')+'>맨 앞으로</button><button type="button" class="btn small" data-act="up" aria-label="앞으로"'+(i===0?' disabled':'')+'>←</button><button type="button" class="btn small" data-act="down" aria-label="뒤로"'+(i===ITEMS.length-1?' disabled':'')+'>→</button>'+
    '<label class="btn small">사진 바꾸기<input type="file" accept="image/*" data-act="replace" class="hide"></label><button type="button" class="btn small danger" data-act="del">삭제</button></div><p class="state"></p></div></div>';}).join('');}
$('list').addEventListener('input',function(e){if(e.target.dataset.f){var st=e.target.closest('.item').querySelector('.state');st.className='state';st.textContent='바뀐 내용이 있어요. 저장을 눌러 주세요.';}});
function busy(card,on,msg){card.querySelectorAll('button').forEach(function(b){b.disabled=on;});var st=card.querySelector('.state');st.className='state';st.textContent=msg||'';}
$('list').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;var card=b.closest('.item'),n=+card.dataset.no,act=b.dataset.act,req;
  if(act==='save'){var m=readMeta(card);if(!m.name){toast('이름을 적어 주세요.');return;}req=Object.assign({action:'update',no:n},m);}
  else if(act==='del'){if(!confirm(no(n)+'번 사진을 지울까요? 지우면 되돌릴 수 없어요.'))return;req={action:'delete',no:n};}
  else if(act==='top')req={action:'top',no:n};
  else if(act==='up'||act==='down')req={action:'move',no:n,dir:act==='up'?-1:1};
  if(!req)return;busy(card,true,'처리하는 중…');
  api(req).then(function(d){ITEMS=d.items;renderList();toast(act==='save'?no(n)+'번을 저장했어요.':act==='del'?no(n)+'번을 지웠어요.':'순서를 바꿨어요.');})
  .catch(function(err){busy(card,false);var st=card.querySelector('.state');st.className='state err';st.textContent=err.message;});});
$('list').addEventListener('change',function(e){var inp=e.target;if(inp.dataset.act!=='replace'||!inp.files[0])return;var card=inp.closest('.item'),n=+card.dataset.no;
  busy(card,true,'사진을 줄이는 중…');prepare(inp.files[0]).then(function(p){busy(card,true,'올리는 중…');return api({action:'replace',no:n,big:p.big,small:p.small,w:p.w,h:p.h});})
  .then(function(d){ITEMS=d.items;renderList();toast(no(n)+'번 사진을 바꿨어요.');}).catch(function(err){busy(card,false);var st=card.querySelector('.state');st.className='state err';st.textContent=err.message;});});

/* 사진 줄이기: 큰 사진 1400px, 작은 사진 560px (촬영 위치 같은 정보는 이때 빠져요) */
function loadImg(file){
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaImg(file);});
  return viaImg(file);}
function viaImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res(im);};im.onerror=function(){rej(new Error('이 사진은 열 수 없어요. JPG나 PNG로 올려 주세요.'));};im.src=u;});}
function shrink(src,max,q){var w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k);
  var c=document.createElement('canvas');c.width=cw;c.height=ch;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.imageSmoothingQuality='high';g.drawImage(src,0,0,cw,ch);
  return {url:c.toDataURL('image/jpeg',q),w:cw,h:ch};}
function prepare(file){return loadImg(file).then(function(im){var b=shrink(im,1400,.82),s=shrink(im,560,.8);if(im.close)im.close();return {big:b.url,small:s.url,w:s.w,h:s.h};});}

$('file').addEventListener('change',function(){var fs=[].slice.call(this.files);this.value='';
  fs.forEach(function(f){var id=++nid;var o={id:id,file:f,name:'',kind:'basket',tones:[]};NEW.push(o);
    var card=document.createElement('div');card.className='item new';card.dataset.id=id;
    card.innerHTML='<div class="pic"><img alt=""><span class="no">새 사진</span></div><div class="body">'+metaFields(o)+'<div class="acts"><button type="button" class="btn small primary" data-up>올리기</button><button type="button" class="btn small" data-cancel>빼기</button></div><p class="state"></p></div>';
    $('newList').appendChild(card);
    prepare(f).then(function(p){o.p=p;card.querySelector('img').src=p.small;}).catch(function(err){o.err=err.message;var st=card.querySelector('.state');st.className='state err';st.textContent=err.message;});});
  $('upAllRow').classList.toggle('hide',NEW.length<2);});
function upload(o,card){if(o.err)return Promise.resolve(false);var m=readMeta(card);if(!m.name){var st0=card.querySelector('.state');st0.className='state err';st0.textContent='이름을 적어 주세요.';return Promise.resolve(false);}
  var wait=o.p?Promise.resolve(o.p):prepare(o.file).then(function(p){o.p=p;return p;});busy(card,true,'올리는 중…');
  return wait.then(function(p){return api(Object.assign({action:'upload',big:p.big,small:p.small,w:p.w,h:p.h},m));}).then(function(d){ITEMS=d.items;renderList();
    NEW=NEW.filter(function(x){return x!==o;});card.remove();$('upAllRow').classList.toggle('hide',NEW.length<2);toast(no(d.item.no)+'번으로 올렸어요.');return true;})
  .catch(function(err){busy(card,false);var st=card.querySelector('.state');st.className='state err';st.textContent=err.message;return false;});}
$('newList').addEventListener('click',function(e){var card=e.target.closest('.item');if(!card)return;var o=NEW.filter(function(x){return x.id===+card.dataset.id;})[0];if(!o)return;
  if(e.target.closest('[data-cancel]')){NEW=NEW.filter(function(x){return x!==o;});card.remove();$('upAllRow').classList.toggle('hide',NEW.length<2);}
  else if(e.target.closest('[data-up]'))upload(o,card);});
$('upAll').addEventListener('click',function(){var list=NEW.slice(),i=0;(function next(){if(i>=list.length)return;var o=list[i++],card=$('newList').querySelector('[data-id="'+o.id+'"]');if(!card)return next();upload(o,card).then(next);})();});

if(KEY)api({action:'check'}).then(enter).catch(function(){});
})();
</script>
</body>
</html>
